# ZProject — orkestrasi (disesuaikan utk VPS shared dgn PickHub).
# - API di 127.0.0.1:4002 (bukan 4000, dipakai PickHub prod)
# - Meili di 127.0.0.1:7702 (bukan 7700/7701)
# - Nginx TIDAK di-compose (dipakai Nginx host + Certbot, pola PickHub)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradertrack
      POSTGRES_USER: tradertrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradertrack}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradertrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tradertrack:${POSTGRES_PASSWORD}@db:5432/tradertrack
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET di .env}
      UPLOADS_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:4002:4000"

  meili:
    image: getmeili/meilisearch:v1.13
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY di .env}
    volumes:
      - meilidata:/meili_data
    ports:
      - "127.0.0.1:7702:7700"

volumes:
  dbdata:
  uploads:
  meilidata:
